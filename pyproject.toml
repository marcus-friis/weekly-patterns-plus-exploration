[project]
name = "wpp"
version = "0.1.0"
description = "Exploration of weekly patterns plus data by Advan Research"
readme = "README.md"
authors = [
    { name = "Marcus", email = "marfri@itu.dk" }
]
requires-python = ">=3.14"
dependencies = [
    "contextily>=1.7.1",
    "duckdb>=1.5.5",
    "geopandas>=1.1.4",
    "matplotlib>=3.11.1",
    "networkx>=3.6.1",
    "orjson>=3.12.0",
    "polars>=1.44.2",
    "pyarrow>=25.0.1",
    "scipy>=1.18.1",
    "seaborn>=0.13.2",
    "typer>=0.27.2",
]

[tool.uv]
package = true

[project.scripts]
wpp = "wpp.cli:app"

[build-system]
requires = ["uv_build>=0.12.8,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
]
